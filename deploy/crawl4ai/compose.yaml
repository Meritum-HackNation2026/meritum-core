# Crawl4AI for pages that need JavaScript (core#30, ADR-32). Not deployed by CI.
# Start: CRAWL4AI_API_TOKEN=$(openssl rand -hex 32) docker compose -f deploy/crawl4ai/compose.yaml up -d
# Worker: MERITUM_FETCH_CRAWL4AI_URL=http://crawl4ai:11235 MERITUM_FETCH_CRAWL4AI_TOKEN=<the same token>
# Internal addresses must be blocked on the host (DOCKER-USER rules in README):
# Docker networks cannot refuse egress by address on their own.
services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN}
      CRAWL4AI_HOOKS_ENABLED: "false"
      CRAWL4AI_ALLOW_DEEP_CRAWL: "false"
    shm_size: 1g
    read_only: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      fetch: {}
      egress: {}
    # no published ports: only the worker on the "fetch" network reaches it
networks:
  fetch:
    internal: true  # worker <-> crawl4ai only, no route out
  egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-crawl4ai  # matched by the DOCKER-USER rules
