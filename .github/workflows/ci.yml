name: CI

# lint, tests and contracts run in parallel on the GCP runners (labels self-hosted, meritum).
# A newer push to the same branch cancels them, except on main.
# No deploy: meritum-core is a library that meritum-backend and meritum-worker
# pin in their uv.lock.
on:
  push:
    branches: ["**"] # one run per commit; a PR shows the run of its head commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false # ~/.cache/uv stays on the self-hosted runner
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run python scripts/check_conventions.py # docstrings, Features:, constants, 250 lines
      - run: uv run vulture # dead code
      - run: uv run bandit -c pyproject.toml -r src scripts # security (ruff S runs the same rules)

  tests:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest # includes tests/architecture (pytestarch)

  # Generated contracts (contracts/meritum.schema.json, contracts/meritum.ts) must
  # match src/meritum_core/checks/contracts.py; versions pinned (uv.lock, generator).
  contracts:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: scripts/generate-contracts.sh --check
