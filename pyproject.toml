[project]
name = "meritum-core"
version = "0.1.0"
description = "Meritum: wspólne kontrakty, porty i adaptery dla backendu i workerów"
readme = "README.md"
authors = [{ name = "Cyprian Gburek" }]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.44.9",
    "dbos>=3.6.0",
    "google-auth>=2.63.0",
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14.4",
    "pydantic-ai-slim[google,openrouter]>=2.71.0",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.2",
    "trafilatura>=2.3.1",
]

[project.scripts]
meritum-migrate-app = "meritum_core.shared.database.adapters:main"  # run by the worker's deploy (worker/035)

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "behave>=1.3.3",
    "gcp-storage-emulator>=2026.7.19",
    "moto[server]>=5.2.5",
    "pytest>=9.2.0",
    "pytestarch>=5.1.1",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "vulture>=2.16",
]

# --------------------------------------------------------------------------- #
# Ruff: lint + format (the same config in core, backend and worker)
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY",                                  # no per-file license headers
    "missing-trailing-comma",               # managed by `ruff format`
    "undocumented-magic-method",            # __eq__, __hash__ ... follow the data model
    "undocumented-public-init",             # documented in the class docstring
    # Pydantic and FastAPI read annotations at runtime: keep real imports.
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
]

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts and literals; tests/ is not a package (pytest importlib mode).
"tests/**/*.py" = ["assert", "magic-value-comparison", "D", "DOC", "implicit-namespace-package", "line-too-long"]  # long Polish fixture strings
"scripts/**/*.py" = ["implicit-namespace-package"]  # standalone scripts, not a package
"features/**/*.py" = ["implicit-namespace-package", "assert"]  # behave loads steps by path; steps assert like tests
# Bare names tell vulture they are used; the file is never imported.
"vulture_whitelist.py" = ["implicit-namespace-package", "useless-expression"]
# Check contracts. line-too-long: class docstrings and Field descriptions are published
# in contracts/meritum.schema.json, so rewrapping them would change the generated files.
# mutable-class-default: Pydantic copies list defaults per instance; ruff cannot see
# that _Model (in _base.py) is a BaseModel, and default_factory would drop
# "default": [] from the published schema.
"src/meritum_core/checks/contracts/_claims.py" = ["line-too-long", "mutable-class-default"]
"src/meritum_core/checks/contracts/_progress.py" = ["line-too-long"]
# EM101/EM102/TRY003 too: Pydantic validators raise ValueError with the rule itself as
# the message, which ValidationError shows.
"src/meritum_core/checks/contracts/_context.py" = ["line-too-long", "raise-vanilla-args", "raw-string-in-exception"]
"src/meritum_core/checks/contracts/_moderation.py" = ["line-too-long", "raise-vanilla-args", "raw-string-in-exception"]
"src/meritum_core/checks/contracts/_notifications.py" = ["line-too-long", "raise-vanilla-args", "raw-string-in-exception", "f-string-in-exception"]
"src/meritum_core/checks/contracts/_request.py" = ["line-too-long", "raise-vanilla-args", "raw-string-in-exception"]
"src/meritum_core/checks/contracts/_sources.py" = ["line-too-long", "raise-vanilla-args", "raw-string-in-exception", "f-string-in-exception", "mutable-class-default"]
"src/meritum_core/checks/contracts/_strength.py" = ["line-too-long", "raise-vanilla-args", "f-string-in-exception"]
"src/meritum_core/checks/contracts/_verdict_rules.py" = ["raise-vanilla-args", "raw-string-in-exception", "f-string-in-exception"]
"src/meritum_core/checks/contracts/_records.py" = ["line-too-long", "raise-vanilla-args", "raw-string-in-exception", "mutable-class-default"]
"src/meritum_core/checks/contracts/_results.py" = ["line-too-long", "raise-vanilla-args", "raw-string-in-exception", "f-string-in-exception", "mutable-class-default"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # also turns off D203/D213 and the other non-Google rules

# Complexity limits: decompose instead of raising them (docs/architecture.md).
# Ruff's defaults, written out, except nested blocks and boolean expressions: a
# condition with more than 3 parts becomes named booleans or a predicate.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-statements = 50
max-returns = 6
max-locals = 15
max-nested-blocks = 3
max-bool-expr = 3

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# ty: strict
# --------------------------------------------------------------------------- #
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "scripts", "features"]

[tool.ty.rules]
all = "error"

# behave's given/when/then are placeholders that behave swaps for the real step
# decorators while loading features/steps/, so ty cannot type them statically.
[[tool.ty.overrides]]
include = ["features/steps/**"]

[tool.ty.overrides.rules]
not-callable = "ignore"
dynamic-function-decorator-return = "ignore"

[tool.ty.terminal]
error-on-warning = true

# --------------------------------------------------------------------------- #
# Conventions Ruff and ty cannot express: scripts/check_conventions.py
# (docs/architecture.md). Every exception maps a path to its reason.
# --------------------------------------------------------------------------- #
[tool.meritum-conventions]
max-lines = 250

[tool.meritum-conventions.line-limit-exceptions]

[tool.meritum-conventions.module-exceptions]

[tool.meritum-conventions.constants-exceptions]
"src/meritum_core/jobs/contracts/_workflows.py" = "the workflow specs and WORKFLOWS are built from the contract models; a constants.py would import them back (cycle)"
"src/meritum_core/corpus/ready/adapters/_postgres.py" = "SQL text of the gold search stays next to the code that runs it; weights are in corpus/ready/constants.py"
"src/meritum_core/corpus/adapters/_postgres.py" = "SQL text of the PostgreSQL adapter stays next to the code that runs it; the tunable weights are in corpus/constants.py"
"src/meritum_core/corpus/adapters/_legal_meta.py" = "SQL text of the PostgreSQL adapter stays next to the code that runs it"
"src/meritum_core/checks/adapters/_postgres.py" = "the kind-to-column map is SQL of the PostgreSQL adapter and stays next to the queries that use it"
"src/meritum_core/notifications/adapters/_postgres.py" = "the kind-to-column map is SQL of the PostgreSQL adapter and stays next to the queries that use it"

# --------------------------------------------------------------------------- #
# Dead code (vulture) and security (bandit)
# --------------------------------------------------------------------------- #
[tool.vulture]
paths = ["src", "scripts", "tests", "features", "vulture_whitelist.py"]
# Contract models: their fields are read through JSON and in meritum-backend/worker,
# never as attributes here.
exclude = ["src/meritum_core/checks/contracts/"]
min_confidence = 60
ignore_decorators = ["@given", "@when", "@then", "@model_validator", "@override"]  # behave calls step functions, Pydantic calls validators, a base class calls overrides
ignore_names = ["app_database_url"]  # tests/conftest.py fixture, requested by name through getfixturevalue

# bandit is a security linter, not a dead-code tool. Ruff's S rules already run
# bandit's checks; bandit itself runs too because the team asked for it.
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
# Integration tests (real PostgreSQL, a real provider) run only locally:
# `uv run pytest -m integration`; a later -m on the command line wins.
addopts = ["-ra", "--import-mode=importlib", "-p", "pytester", "-m", "not integration"]
markers = [
    "integration: needs a real PostgreSQL or provider; local only, never in CI",
]
filterwarnings = ["error"]
